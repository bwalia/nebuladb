# Auto Tag on Merge to Main
#
# Same pattern as fishers / wslvault / jobshout: every push to main cuts the
# next patch tag (vMAJOR.MINOR.PATCH). Manual major/minor via workflow_dispatch.
#
# deploy-k3s.yml waits for a v* tag on this SHA before baking NEBULADB_VERSION
# into the server image (footer /healthz) — same idea as opsapi's
# autotag-before-build.
#
# publish.yml listens for `v*.*.*` and pushes versioned Hub tags.
#
# Skip with `[skip tag]` in the commit message.

name: Auto Tag on Merge to Main

on:
  push:
    branches:
      - main
    # The static site (website/) deploys through pages.yml only.
    paths-ignore:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      version_type:
        type: choice
        description: "Version bump type (for manual major/minor bumps)"
        required: false
        default: "patch"
        options:
          - patch
          - minor
          - major
      custom_version:
        type: string
        description: "Custom version (e.g., v1.2.0) - overrides version_type"
        required: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  # Serialize tagging so two quick merges can't race to the same version.
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  auto-tag:
    name: Create Incremental Tag
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && (github.event_name == 'workflow_dispatch'
          || !contains(github.event.head_commit.message, '[skip tag]'))
    outputs:
      tag_created: ${{ steps.create_tag.outputs.tag_created }}
      next_version: ${{ steps.calc_version.outputs.next_version }}

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: get_latest_tag
        run: |
          set -euo pipefail
          git fetch --tags --force
          ALL_TAGS=$(
            {
              git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//'
              git tag -l '[0-9]*.[0-9]*.[0-9]*'
            } | sort -u -V
          )
          LATEST_BARE=$(echo "$ALL_TAGS" | tail -1)

          if [ -z "$LATEST_BARE" ]; then
            LATEST_TAG="v0.1.0"
            echo "No existing tags found, starting at v0.1.0"
          else
            LATEST_TAG="v${LATEST_BARE}"
            echo "Latest tag: $LATEST_TAG"
          fi

          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: calc_version
        run: |
          set -euo pipefail
          LATEST_TAG="${{ steps.get_latest_tag.outputs.latest_tag }}"

          if [ -n "${{ github.event.inputs.custom_version }}" ]; then
            NEXT_VERSION="${{ github.event.inputs.custom_version }}"
            case "$NEXT_VERSION" in
              v*) ;;
              *) NEXT_VERSION="v${NEXT_VERSION}" ;;
            esac
            echo "Using custom version: $NEXT_VERSION"
            BASE_VERSION="${NEXT_VERSION#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          elif [ -n "${{ github.event.inputs.version_type }}" ] \
              && [ "${{ github.event.inputs.version_type }}" != "patch" ]; then
            VERSION_TYPE="${{ github.event.inputs.version_type }}"
            BASE_VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

            if [ "$VERSION_TYPE" = "major" ]; then
              MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
            elif [ "$VERSION_TYPE" = "minor" ]; then
              MINOR=$((MINOR + 1)); PATCH=0
            fi

            NEXT_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            echo "Manual $VERSION_TYPE bump: $LATEST_TAG -> $NEXT_VERSION"
          else
            BASE_VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
            PATCH=$((PATCH + 1))
            NEXT_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            while git ls-remote --exit-code --tags origin "refs/tags/${NEXT_VERSION}" >/dev/null 2>&1; do
              PATCH=$((PATCH + 1))
              NEXT_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            done
            echo "Auto patch bump: $LATEST_TAG -> $NEXT_VERSION"
          fi

          {
            echo "next_version=$NEXT_VERSION"
            echo "major=$MAJOR"
            echo "minor=$MINOR"
            echo "patch=$PATCH"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        id: create_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VERSION: ${{ steps.calc_version.outputs.next_version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Already tagged this commit? (re-run / race)
          EXISTING=$(git ls-remote --tags "https://github.com/${{ github.repository }}" 2>/dev/null \
            | awk -v sha="$SHA" '$1 == sha { print $2 }' \
            | sed 's#refs/tags/##; s#\^{}##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -n "$EXISTING" ]; then
            echo "::notice::${SHA} is already tagged ${EXISTING}"
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
            echo "next_version=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh api "repos/${{ github.repository }}/git/ref/tags/${NEXT_VERSION}" >/dev/null 2>&1; then
            echo "::notice::Tag $NEXT_VERSION already exists — skipping"
            echo "tag_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MSG="Release ${NEXT_VERSION}"
          TAG_SHA=$(gh api -X POST "repos/${{ github.repository }}/git/tags" \
            -f tag="$NEXT_VERSION" \
            -f message="$MSG" \
            -f object="$SHA" \
            -f type=commit \
            -f tagger.name="github-actions[bot]" \
            -f tagger.email="41898282+github-actions[bot]@users.noreply.github.com" \
            --jq .sha)
          gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${NEXT_VERSION}" \
            -f sha="$TAG_SHA" >/dev/null

          echo "tag_created=true" >> "$GITHUB_OUTPUT"
          echo "Created $NEXT_VERSION -> $SHA (tag object $TAG_SHA)"

      - name: Create GitHub Release
        if: steps.create_tag.outputs.tag_created == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.calc_version.outputs.next_version }}
          name: Release ${{ steps.calc_version.outputs.next_version }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}

      - name: Notify Slack on new release
        if: steps.create_tag.outputs.tag_created == 'true'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping notification"
            exit 0
          fi

          NEXT_VERSION="${{ steps.calc_version.outputs.next_version }}"
          COMMIT_SHA="${{ github.sha }}"
          ACTOR="${{ github.actor }}"
          LOGS_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg version "$NEXT_VERSION" \
              --arg commit "$COMMIT_SHA" \
              --arg actor "$ACTOR" \
              --arg logs "$LOGS_URL" \
              '{text: (":tag: *New Release Tagged*\nVersion: `\($version)`\nCommit: `\($commit)`\nTriggered by: \($actor)\nLogs: \($logs)")}')"
