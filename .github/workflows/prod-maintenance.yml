# One-off scheduled prod maintenance: 06:00 GMT, 28 Nov 2026.
#
# Runs the staged prod deploy (deploy-k3s, build-and-deploy) and revokes
# the leaked nk_int_363cb1555… API key in the same pass, so the leader
# restarts once:
#   - preflight: follower Ready + caught up, else nothing changes;
#   - the old key is dropped from NEBULA_API_KEYS;
#   - leader + showcase are held while follower and region-b roll onto
#     the new build and key list (~25 min, no user impact);
#   - the leader is released: reads fail over to the follower, writes
#     get a clean "retry shortly" 503 for its ~25 min recovery, and the
#     showcase switches to the new key as the old leader goes away.
# Posts the outcome to Slack. The date guard makes the cron inert after
# that day; delete this file afterwards.
name: prod-maintenance

on:
  schedule:
    - cron: "0 6 28 11 *"
  workflow_dispatch:
    inputs:
      FORCE:
        description: Run now regardless of the date guard
        type: boolean
        default: false

concurrency:
  group: prod-maintenance
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Date guard
        id: guard
        run: |
          if [ "${{ github.event.inputs.FORCE }}" = true ] || [ "$(date -u +%F)" = 2026-11-28 ]; then
            echo "go=true" >>"$GITHUB_OUTPUT"
          else
            echo "Not 2026-11-28: nothing to do."; echo "go=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Dispatch staged prod deploy with key revoke
        id: dispatch
        if: steps.guard.outputs.go == 'true'
        run: |
          set -euo pipefail
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run deploy-k3s.yml --ref main \
            -f TARGET_ENV=prod -f DEPLOYMENT_TYPE=build-and-deploy \
            -f REVOKE_KEY_PREFIX=nk_int_363cb1555
          for _ in $(seq 1 30); do
            id=$(gh run list --workflow deploy-k3s.yml --event workflow_dispatch --limit 5 \
                  --json databaseId,createdAt -q "[.[] | select(.createdAt >= \"$since\")][0].databaseId")
            [ -n "$id" ] && break
            sleep 10
          done
          [ -n "${id:-}" ] || { echo "dispatched run not found" >&2; exit 1; }
          echo "run_id=$id" >>"$GITHUB_OUTPUT"
          echo "deploy run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/$id"

      - name: Follow the deploy
        id: follow
        if: steps.guard.outputs.go == 'true'
        run: |
          set -uo pipefail
          gh run watch "${{ steps.dispatch.outputs.run_id }}" --interval 60 --exit-status >/dev/null
          rc=$?
          gh run view "${{ steps.dispatch.outputs.run_id }}" --json conclusion,jobs \
            -q '"conclusion: \(.conclusion)", (.jobs[] | "  \(.name): \(.conclusion)")' | tee /tmp/summary.txt
          exit $rc

      - name: Slack
        if: always() && steps.guard.outputs.go == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OUTCOME: ${{ steps.follow.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.dispatch.outputs.run_id }}
        run: |
          [ -n "${SLACK_WEBHOOK_URL:-}" ] || exit 0
          if [ "$OUTCOME" = success ]; then icon=":white_check_mark:"; msg="prod maintenance done: new server build live, leaked key revoked."
          else icon=":rotating_light:"; msg="prod maintenance did NOT complete ($OUTCOME). If the leader is paused it is still serving the old build."; fi
          text=$(printf '%s *NebulaDB* %s\n```%s```\n<%s|deploy run>' "$icon" "$msg" "$(cat /tmp/summary.txt 2>/dev/null)" "$RUN_URL")
          jq -n --arg t "$text" '{text: $t}' | curl -fsS -X POST -H 'content-type: application/json' --data @- "$SLACK_WEBHOOK_URL" >/dev/null
