# Minimal scrape config for the NebulaDB demo stack.
# `nebula-server` exposes a plain Prometheus text endpoint at /metrics
# (no TLS, no auth — intentional for ops tooling, see router.rs).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Label every metric with the cluster identity so a later multi-node
  # setup remains queryable without rewriting dashboards.
  external_labels:
    cluster: nebuladb-dev

# WAL / snapshot durability alerts (issue #69). The file is mounted
# into the container at /etc/prometheus/alerts.yml by docker-compose.
rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  # Both HA nodes share job + service so existing alert exprs keep
  # working; `role` distinguishes leader vs follower on dashboards
  # (Grafana $role template → role=~"$role").
  - job_name: nebula-server
    metrics_path: /metrics
    static_configs:
      - targets: ["nebula-server:8080"]
        labels:
          service: nebula-server
          role: leader
      - targets: ["nebula-follower:8080"]
        labels:
          service: nebula-server
          role: follower

  # Gatus exposes probe results at /metrics when `metrics: true` in
  # deploy/gatus/config.yaml. Gives Grafana a stack-wide "what's red"
  # view without clicking through the Gatus UI.
  - job_name: gatus
    metrics_path: /metrics
    static_configs:
      - targets: ["gatus:8080"]
        labels:
          service: gatus

  # Prometheus scraping itself is the cheapest way to spot a broken
  # scrape config (missing targets show up as `up == 0`).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
