# Ring Promoter app definitions for NebulaDB (workstation instance).
#
# Append these blocks to the `apps:` list in:
#   bwalia/ring-promoter deploy/k8s/configmap.yaml
# (live: kubectl -n workstation-ring-promoter get cm ring-promoter-config)
#
# Order matters: place nebuladb-edge ABOVE nebuladb so DNS/vhost exist
# before a public /livez health check can pass.
#
# Deployer is `github` (RP_GITHUB_TOKEN). Edge registration is DNS +
# control-plane only; the showcase deploy builds images and helm-upgrades.

  - name: nebuladb-edge
    display_name: "NebulaDB edge (DNS + vhost)"
    location: { lat: 51.5074, lng: -0.1278, city: London, region: GB }
    deployer: github
    github:
      owner: bwalia
      repo: nebuladb
      workflow: register-edge-vhost.yml
      ref: main
      deploy_mode: full
      token_env: RP_GITHUB_TOKEN
      poll_interval: 15s
      run_lookup_timeout: 90s
    rings:
      # /livez skips showcase auth (`/` redirects to Google OAuth in prod).
      int:  { target_env: int,  health_url: "https://int-nebuladb.nebuladb.net/livez" }
      test: { target_env: test, health_url: "https://test-showcase.nebuladb.net/livez" }
      acc:  { target_env: acc,  health_url: "https://acc-showcase.nebuladb.net/livez" }
      prod: { target_env: prod, health_url: "https://showcase.nebuladb.net/livez" }

  - name: nebuladb
    display_name: "NebulaDB Showcase"
    location: { lat: 51.5074, lng: -0.1278, city: London, region: GB }
    deployer: github
    github:
      owner: bwalia
      repo: nebuladb
      workflow: deploy-k3s.yml
      ref: main
      env_input: TARGET_ENV
      version_input: IMAGE_TAG
      mode_input: DEPLOYMENT_TYPE
      deploy_mode: build-and-deploy
      token_env: RP_GITHUB_TOKEN
      poll_interval: 20s
      run_lookup_timeout: 90s
    rings:
      int:  { target_env: int,  health_url: "https://int-nebuladb.nebuladb.net/livez",  links: [ { label: "Showcase int", url: "https://int-nebuladb.nebuladb.net/" } ] }
      test: { target_env: test, health_url: "https://test-showcase.nebuladb.net/livez", links: [ { label: "Showcase test", url: "https://test-showcase.nebuladb.net/" } ] }
      acc:  { target_env: acc,  health_url: "https://acc-showcase.nebuladb.net/livez",  links: [ { label: "Showcase acc", url: "https://acc-showcase.nebuladb.net/" } ] }
      prod: { target_env: prod, health_url: "https://showcase.nebuladb.net/livez",      links: [ { label: "Showcase", url: "https://showcase.nebuladb.net/" } ] }
