# Production environment — namespace `prod`, host showcase.nebuladb.net.
# See values-int.yaml for the full rationale. Prod sizes the data
# volume larger and pins a richer resource request; host/namespace/TLS
# secret differ per environment.

server:
  image:
    repository: bwalia/nebula-server
    tag: "latest"
    pullPolicy: IfNotPresent

  # Prod gets a larger durable volume. NebulaDB's HNSW index is
  # RAM-bound (~4 bytes/dim/doc) so bump memory here as the corpus grows.
  #
  # 8Gi was not enough. HNSW deletes are soft (nebula-vector/src/hnsw.rs
  # "Deletions are soft (tombstones)") and nothing ever reclaims the
  # arena, so the resident set only ever grows: the Sep 7 admin-empty of
  # the 417k-doc leads bucket left every one of those vectors in memory,
  # and a client re-ingesting leads at ~850 docs/min piled new nodes on
  # top. Prod hit the 8Gi cap roughly every 60 minutes, and each OOMKill
  # cost ~45 minutes of cold recovery replaying a 2.3G snapshot, during
  # which showcase.nebuladb.net served 504. Limit raised to 24Gi on a
  # node with ~97Gi free.
  #
  # Requests were 1Gi against a real working set of 3-8Gi, which let the
  # scheduler treat this as a small pod and over-pack the node. Requests
  # now reflect what the process actually holds after recovery.
  #
  # This is headroom, not a fix: without tombstone reclamation the arena
  # still grows without bound and 24Gi only buys time.
  #
  # Sep 10: 24Gi -> 32Gi. Under the lead feeder's write load every image
  # grew from ~8Gi to 16-22Gi within 25 minutes of serving — glibc malloc
  # arena bloat (~15Gi in per-thread arena heaps, see the global
  # allocator note in nebula-server/src/main.rs) — and a snapshot adds
  # ~5Gi at peak, which put the 24Gi pod within 1Gi of an OOMKill. The
  # server now uses jemalloc; 32Gi keeps headroom until its footprint is
  # measured in prod, after which this can come back down.
  resources:
    limits:
      cpu: "4"
      memory: "32Gi"
    requests:
      cpu: "500m"
      memory: "8Gi"

  persistence:
    enabled: true
    storageClass: local-path
    size: 50Gi
    accessModes:
      - ReadWriteOnce

  ingress:
    enabled: true
    className: traefik-edge
    annotations:
      cert-manager.io/cluster-issuer: main-issuer
    hosts:
      - host: showcase.nebuladb.net
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - showcase.nebuladb.net
        secretName: nebuladb-prod-tls

showcase:
  enabled: true
  image:
    repository: bwalia/nebula-showcase
    tag: "latest"
    pullPolicy: IfNotPresent

# App secrets from wslvault (ESO) — pulls secret/nebuladb/prod/config
# Disabled until Vault is provisioned (policy granting read on
# secret/nebuladb/* + seeded secret/nebuladb/prod/config). helm --wait
# gates the rollout on this CR, so enabling it before Vault is ready
# times out the deploy; nebula-server runs fine via optional envFrom.
# Flip to true once the Vault policy + seed exist.
externalSecret:
  enabled: false
environment: prod

# Within-region follower + cross-region second leader. Same topology as
# int; Raft stays off. Follower PVC is smaller than the primary 50Gi
# until catch-up proves size needs — bump if the mirror OOMs.
ha:
  withinRegion:
    enabled: true
    followers: 1
    persistence:
      size: 50Gi
    # Mirror needs the same working set as the leader (~full index).
    resources:
      limits:
        cpu: "4"
        memory: "32Gi"
      requests:
        cpu: "500m"
        memory: "8Gi"
  crossRegion:
    enabled: true
    region: us-east-1
    peerRegion: us-west-2
    deployPeerLeader: true
    persistence:
      size: 50Gi
    resources:
      limits:
        cpu: "4"
        memory: "32Gi"
      requests:
        cpu: "500m"
        memory: "8Gi"


