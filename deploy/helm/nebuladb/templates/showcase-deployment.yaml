{{- if .Values.showcase.enabled -}}
{{- if and .Values.showcase.googleAuth.enabled (not .Values.showcase.googleAuth.redirectUrl) -}}
{{- fail "showcase.googleAuth.enabled=true needs showcase.googleAuth.redirectUrl (e.g. https://showcase.nebuladb.net)" -}}
{{- end -}}
{{- if and .Values.showcase.googleAuth.enabled (not .Values.showcase.auth.vault.enabled) (not .Values.showcase.auth.existingSecret) -}}
{{- fail "showcase.googleAuth.enabled=true needs showcase.auth.vault.enabled or showcase.auth.existingSecret (GOOGLE_OAUTH_* + OAUTH2_PROXY_COOKIE_SECRET)" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nebuladb.fullname" . }}-showcase
  labels:
    {{- include "nebuladb.showcase.selectorLabels" . | nindent 4 }}
    {{- include "nebuladb.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nebuladb.showcase.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nebuladb.showcase.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: showcase
          image: "{{ .Values.showcase.image.repository }}:{{ .Values.showcase.image.tag }}"
          imagePullPolicy: {{ .Values.showcase.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # App secret (optional): supplies NEBULA_API_KEYS so nginx can
          # inject `Authorization: Bearer <key>` on proxied /api calls,
          # keeping the public UI working once the server has auth enabled.
          envFrom:
            - secretRef:
                name: {{ include "nebuladb.fullname" . }}-secrets
                optional: true
          env:
            # The showcase's nginx layer runs envsubst on startup and
            # proxies /api, /healthz, /metrics to this URL. We inject
            # the server Service DNS here so a basic `helm install`
            # has a working UI out of the box.
            - name: NEBULA_SERVER
              value: {{ include "nebuladb.showcase.serverUrl" . | quote }}
            # nginx's upstream pools use bare host:port (no scheme), and
            # they're resolved at config-load, so each must name a Service
            # that exists. The follower is the pools' `backup` peer: it
            # serves reads (and takes failed-over writes) only while the
            # leader is down or recovering. Without a within-region
            # follower both point at the leader, which is harmless.
            - name: NEBULA_LEADER_HOST
              value: {{ include "nebuladb.fullname" . | quote }}
            - name: NEBULA_FOLLOWER_HOST
              {{- if .Values.ha.withinRegion.enabled }}
              value: {{ include "nebuladb.follower.fullname" . | quote }}
              {{- else }}
              value: {{ include "nebuladb.fullname" . | quote }}
              {{- end }}
            - name: NEBULA_REGION_B_HOST
              {{- if and .Values.ha.crossRegion.enabled .Values.ha.crossRegion.deployPeerLeader }}
              value: {{ include "nebuladb.regionB.fullname" . | quote }}
              {{- else }}
              value: {{ include "nebuladb.fullname" . | quote }}
              {{- end }}
            # Cluster DNS for nginx's variable-based proxy_pass (the image
            # default 127.0.0.11 is Docker-only and unreachable in k8s).
            - name: NGINX_RESOLVER
              value: {{ .Values.showcase.nginxResolver | quote }}
            # /mcp → the nebula-mcp sidecar on the pod's loopback.
            - name: NEBULA_MCP
              value: "http://127.0.0.1:8090"
            # Basic auth (apps/showcase/docker-entrypoint.d/15-showcase-auth.envsh).
            # Set explicitly so a SHOWCASE_AUTH_DISABLED key in the app
            # secret can't silently open the UI; only values can.
            # Google OAuth forces nginx basic off; password sign-in then
            # uses oauth2-proxy --htpasswd-file from the same credentials.
            - name: SHOWCASE_AUTH_DISABLED
              value: {{ (not .Values.showcase.auth.enabled) | quote }}
            - name: SHOWCASE_GOOGLE_AUTH
              value: {{ .Values.showcase.googleAuth.enabled | quote }}
            {{- if or .Values.showcase.auth.enabled .Values.showcase.googleAuth.enabled }}
            # optional: password form works when these keys exist in Vault
            # even if basic auth is disabled (Google + email/password).
            - name: SHOWCASE_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "nebuladb.showcase.authSecretName" . }}
                  key: SHOWCASE_AUTH_USERNAME
                  optional: true
            - name: SHOWCASE_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nebuladb.showcase.authSecretName" . }}
                  key: SHOWCASE_AUTH_PASSWORD
                  optional: true
            {{- end }}
          {{- with .Values.showcase.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          # /livez is exempt from auth; `/` answers 401 → /login.
          livenessProbe:
            httpGet:
              path: /livez
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /livez
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            # Override the image-baked template so nginx failover /
            # timeout fixes apply on helm upgrade without a rebuild.
            - name: nginx-template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
            {{- if .Values.showcase.googleAuth.enabled }}
            - name: oauth2-htpasswd
              mountPath: /shared/oauth2
            {{- end }}
        {{- if .Values.showcase.googleAuth.enabled }}
        # Google OAuth (+ optional htpasswd): nginx auth_request → sidecar.
        - name: oauth2-proxy
          image: "{{ .Values.showcase.googleAuth.image.repository }}:{{ .Values.showcase.googleAuth.image.tag }}"
          imagePullPolicy: {{ .Values.showcase.googleAuth.image.pullPolicy }}
          args:
            - --provider=google
            - --http-address=127.0.0.1:4180
            - --upstream=static://202
            - --email-domain={{ .Values.showcase.googleAuth.emailDomains }}
            - --redirect-url={{ .Values.showcase.googleAuth.redirectUrl }}/oauth2/callback
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --pass-access-token=false
            # Branded /login is the interstitial; skip oauth2-proxy's own page.
            - --skip-provider-button=true
            - --htpasswd-file=/shared/oauth2/htpasswd
            - --display-htpasswd-form=true
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=168h
            - --cookie-refresh=1h
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "nebuladb.showcase.authSecretName" . }}
                  key: GOOGLE_OAUTH_CLIENT_ID
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nebuladb.showcase.authSecretName" . }}
                  key: GOOGLE_OAUTH_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nebuladb.showcase.authSecretName" . }}
                  key: OAUTH2_PROXY_COOKIE_SECRET
          volumeMounts:
            - name: oauth2-htpasswd
              mountPath: /shared/oauth2
              readOnly: true
          {{- with .Values.showcase.googleAuth.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if .Values.showcase.mcp.enabled }}
        # MCP adapter for the MCP tab. Loopback-only: nginx in this pod is
        # its sole client, which also satisfies rmcp's Host allow-list.
        - name: mcp
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          # A crash-looping container makes the whole pod NotReady, which
          # would take the showcase UI down with it. Server images built
          # before nebula-mcp shipped (a deploy-only run pinned to an old
          # tag) lack the binary, so idle instead of exiting: /mcp then
          # 502s and only the MCP tab degrades.
          command:
            - /bin/sh
            - -c
            - |
              if [ -x /usr/local/bin/nebula-mcp ]; then exec /usr/local/bin/nebula-mcp; fi
              echo "nebula-mcp is not in this server image; the showcase MCP tab stays offline" >&2
              exec sleep infinity
          env:
            - name: NEBULA_MCP_BIND
              value: "127.0.0.1:8090"
            - name: NEBULA_MCP_UPSTREAM_URL
              value: {{ include "nebuladb.showcase.serverUrl" . | quote }}
          {{- with .Values.showcase.mcp.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- if .Values.showcase.googleAuth.enabled }}
      # oauth2-proxy only accepts bcrypt/SHA htpasswd (not nginx apr1).
      # httpd image provides `htpasswd -B`; run before oauth2-proxy starts.
      initContainers:
        - name: prepare-htpasswd
          image: httpd:2.4-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -euo pipefail
              mkdir -p /shared/oauth2
              if [ -n "${SHOWCASE_AUTH_USERNAME:-}" ] && [ -n "${SHOWCASE_AUTH_PASSWORD:-}" ]; then
                htpasswd -Bbn "$SHOWCASE_AUTH_USERNAME" "$SHOWCASE_AUTH_PASSWORD" \
                  > /shared/oauth2/htpasswd
              else
                # Valid bcrypt entry that matches no real password.
                htpasswd -Bbn nobody "$(dd if=/dev/urandom bs=16 count=1 2>/dev/null | base64)" \
                  > /shared/oauth2/htpasswd
              fi
          env:
            - name: SHOWCASE_AUTH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "nebuladb.showcase.authSecretName" . }}
                  key: SHOWCASE_AUTH_USERNAME
                  optional: true
            - name: SHOWCASE_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nebuladb.showcase.authSecretName" . }}
                  key: SHOWCASE_AUTH_PASSWORD
                  optional: true
          volumeMounts:
            - name: oauth2-htpasswd
              mountPath: /shared/oauth2
      {{- end }}
      volumes:
        - name: nginx-template
          configMap:
            name: {{ include "nebuladb.fullname" . }}-showcase-nginx
        {{- if .Values.showcase.googleAuth.enabled }}
        - name: oauth2-htpasswd
          emptyDir: {}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nebuladb.fullname" . }}-showcase
  labels:
    {{- include "nebuladb.showcase.selectorLabels" . | nindent 4 }}
    {{- include "nebuladb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.showcase.service.type }}
  selector:
    {{- include "nebuladb.showcase.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.showcase.service.port }}
      targetPort: http
      protocol: TCP
{{- end -}}
