{{- if .Values.showcase.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nebuladb.fullname" . }}-showcase
  labels:
    {{- include "nebuladb.showcase.selectorLabels" . | nindent 4 }}
    {{- include "nebuladb.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nebuladb.showcase.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nebuladb.showcase.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: showcase
          image: "{{ .Values.showcase.image.repository }}:{{ .Values.showcase.image.tag }}"
          imagePullPolicy: {{ .Values.showcase.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # App secret (optional): supplies NEBULA_API_KEYS so nginx can
          # inject `Authorization: Bearer <key>` on proxied /api calls,
          # keeping the public UI working once the server has auth enabled.
          envFrom:
            - secretRef:
                name: {{ include "nebuladb.fullname" . }}-secrets
                optional: true
          env:
            # The showcase's nginx layer runs envsubst on startup and
            # proxies /api, /healthz, /metrics to this URL. We inject
            # the server Service DNS here so a basic `helm install`
            # has a working UI out of the box.
            - name: NEBULA_SERVER
              value: {{ include "nebuladb.showcase.serverUrl" . | quote }}
            # nginx's upstream pools use bare host:port (no scheme), and
            # they're resolved at config-load, so each must name a Service
            # that exists. The follower is the pools' `backup` peer: it
            # serves reads (and takes failed-over writes) only while the
            # leader is down or recovering. Without a within-region
            # follower both point at the leader, which is harmless.
            - name: NEBULA_LEADER_HOST
              value: {{ include "nebuladb.fullname" . | quote }}
            - name: NEBULA_FOLLOWER_HOST
              {{- if .Values.ha.withinRegion.enabled }}
              value: {{ include "nebuladb.follower.fullname" . | quote }}
              {{- else }}
              value: {{ include "nebuladb.fullname" . | quote }}
              {{- end }}
            # Cluster DNS for nginx's variable-based proxy_pass (the image
            # default 127.0.0.11 is Docker-only and unreachable in k8s).
            - name: NGINX_RESOLVER
              value: {{ .Values.showcase.nginxResolver | quote }}
            # /mcp → the nebula-mcp sidecar on the pod's loopback.
            - name: NEBULA_MCP
              value: "http://127.0.0.1:8090"
          {{- with .Values.showcase.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            # Override the image-baked template so nginx failover /
            # timeout fixes apply on helm upgrade without a rebuild.
            - name: nginx-template
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
              readOnly: true
        {{- if .Values.showcase.mcp.enabled }}
        # MCP adapter for the MCP tab. Loopback-only: nginx in this pod is
        # its sole client, which also satisfies rmcp's Host allow-list.
        - name: mcp
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          # A crash-looping container makes the whole pod NotReady, which
          # would take the showcase UI down with it. Server images built
          # before nebula-mcp shipped (a deploy-only run pinned to an old
          # tag) lack the binary, so idle instead of exiting: /mcp then
          # 502s and only the MCP tab degrades.
          command:
            - /bin/sh
            - -c
            - |
              if [ -x /usr/local/bin/nebula-mcp ]; then exec /usr/local/bin/nebula-mcp; fi
              echo "nebula-mcp is not in this server image; the showcase MCP tab stays offline" >&2
              exec sleep infinity
          env:
            - name: NEBULA_MCP_BIND
              value: "127.0.0.1:8090"
            - name: NEBULA_MCP_UPSTREAM_URL
              value: {{ include "nebuladb.showcase.serverUrl" . | quote }}
          {{- with .Values.showcase.mcp.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: nginx-template
          configMap:
            name: {{ include "nebuladb.fullname" . }}-showcase-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nebuladb.fullname" . }}-showcase
  labels:
    {{- include "nebuladb.showcase.selectorLabels" . | nindent 4 }}
    {{- include "nebuladb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.showcase.service.type }}
  selector:
    {{- include "nebuladb.showcase.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.showcase.service.port }}
      targetPort: http
      protocol: TCP
{{- end -}}
