{{- if and .Values.showcase.enabled .Values.showcase.sessionLogin.enabled (not .Values.showcase.googleAuth.enabled) -}}
{{- $name := printf "%s-showcase-session" (include "nebuladb.fullname" .) -}}
{{- /* Reuse the live cookie secret so upgrades don't sign everyone out;
       a fresh install (or `helm template`) gets a random one. 32 chars
       = a 32-byte AES key, which oauth2-proxy requires. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $cookie := "" -}}
{{- if and $existing $existing.data (index $existing.data "OAUTH2_PROXY_COOKIE_SECRET") -}}
{{- $cookie = index $existing.data "OAUTH2_PROXY_COOKIE_SECRET" | b64dec -}}
{{- else -}}
{{- $cookie = randAlphaNum 32 -}}
{{- end -}}
# Session cookie key for the password-only oauth2-proxy sidecar
# (showcase.sessionLogin). Delete it and re-run helm upgrade to sign
# every user out.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "nebuladb.showcase.selectorLabels" . | nindent 4 }}
    {{- include "nebuladb.labels" . | nindent 4 }}
type: Opaque
data:
  OAUTH2_PROXY_COOKIE_SECRET: {{ $cookie | b64enc | quote }}
{{- end -}}
