{{- if and .Values.ha.crossRegion.enabled .Values.ha.crossRegion.deployPeerLeader -}}
{{- $resources := .Values.server.resources -}}
{{- with .Values.ha.crossRegion.resources -}}
{{- $resources = . -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nebuladb.regionB.fullname" . }}
  labels:
    {{- include "nebuladb.regionB.selectorLabels" . | nindent 4 }}
    {{- include "nebuladb.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nebuladb.regionB.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "nebuladb.regionB.selectorLabels" . | nindent 8 }}
        {{- with .Values.server.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/server-configmap.yaml") . | sha256sum }}
        {{- with .Values.server.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "nebuladb.serviceAccountName" . }}
      {{- with .Values.server.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          {{- with .Values.server.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: rest
              containerPort: 8080
              protocol: TCP
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: pg
              containerPort: 5432
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "nebuladb.fullname" . }}
            - secretRef:
                name: {{ include "nebuladb.fullname" . }}-secrets
                optional: true
            {{- range $key, $secret := .Values.server.secretEnv }}
            - secretRef:
                name: {{ $secret }}
            {{- end }}
          env:
            - name: NEBULA_BIND
              value: "0.0.0.0:8080"
            - name: NEBULA_GRPC_BIND
              value: "0.0.0.0:50051"
            - name: NEBULA_PG_BIND
              value: "0.0.0.0:5432"
            {{- if .Values.server.persistence.enabled }}
            - name: NEBULA_DATA_DIR
              value: "/var/lib/nebuladb"
            {{- end }}
            - name: NEBULA_NODE_ID
              value: {{ include "nebuladb.regionB.fullname" . | quote }}
            - name: NEBULA_NODE_ROLE
              value: "standalone"
            - name: NEBULA_REGION
              value: {{ .Values.ha.crossRegion.peerRegion | quote }}
            - name: NEBULA_CROSS_REGION_PEERS
              value: {{ include "nebuladb.crossRegion.peersRegionB" . | quote }}
            - name: NEBULA_PEERS
              value: {{ printf "leader=http://%s:%d" (include "nebuladb.server.fullname" .) (int .Values.server.service.restPort) | quote }}
          {{- with .Values.server.livenessProbe }}
          livenessProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.readinessProbe }}
          readinessProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          resources: {{- toYaml $resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.server.persistence.enabled }}
            - name: data
              mountPath: /var/lib/nebuladb
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.server.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "nebuladb.regionB.fullname" . }}-data
        {{- end }}
      {{- with (.Values.ha.crossRegion.nodeSelector | default .Values.server.nodeSelector) }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
