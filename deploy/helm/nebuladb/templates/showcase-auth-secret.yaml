{{- if and .Values.showcase.enabled .Values.showcase.auth.enabled (not .Values.showcase.auth.existingSecret) -}}
{{- $name := include "nebuladb.showcase.authSecretName" . -}}
{{- if .Values.showcase.auth.vault.enabled -}}
{{- if and (not .Values.showcase.auth.vault.key) (not .Values.environment) -}}
{{- fail "showcase.auth.vault.enabled=true needs showcase.auth.vault.key or `environment` to build the WSLVault path" -}}
{{- end -}}
# Showcase basic-auth credentials from WSLVault (ESO). Every key under the
# path lands in the Secret; it must hold SHOWCASE_AUTH_USERNAME and
# SHOWCASE_AUTH_PASSWORD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "nebuladb.showcase.selectorLabels" . | nindent 4 }}
    {{- include "nebuladb.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.showcase.auth.vault.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.showcase.auth.vault.storeKind }}
    name: {{ .Values.showcase.auth.vault.store }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    # Keep the Secret if Vault sync is switched off, so the showcase
    # doesn't lose its credentials mid-change.
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ .Values.showcase.auth.vault.key | default (printf "nebuladb/%s/showcase-auth" .Values.environment) }}
        # Match ESO admission-webhook defaults (see server-externalsecret.yaml).
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- else -}}
{{- /* Reuse the live password so upgrades don't log everyone out; a
       fresh install (or `helm template`, where lookup is empty) gets a
       random one. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $password := "" -}}
{{- if and $existing $existing.data (index $existing.data "SHOWCASE_AUTH_PASSWORD") -}}
{{- $password = index $existing.data "SHOWCASE_AUTH_PASSWORD" | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 24 -}}
{{- end -}}
# Basic-auth credentials for the showcase UI. Rotate by deleting the
# Secret and re-running helm upgrade (a new random password is issued).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "nebuladb.showcase.selectorLabels" . | nindent 4 }}
    {{- include "nebuladb.labels" . | nindent 4 }}
type: Opaque
data:
  SHOWCASE_AUTH_USERNAME: {{ .Values.showcase.auth.username | b64enc | quote }}
  SHOWCASE_AUTH_PASSWORD: {{ $password | b64enc | quote }}
{{- end -}}
{{- end -}}
