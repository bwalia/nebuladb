{{- if and .Values.ha.withinRegion.enabled .Values.server.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nebuladb.follower.fullname" . }}-data
  labels:
    {{- include "nebuladb.follower.selectorLabels" . | nindent 4 }}
    {{- include "nebuladb.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml (.Values.ha.withinRegion.persistence.accessModes | default .Values.server.persistence.accessModes) | nindent 4 }}
  {{- $sc := .Values.ha.withinRegion.persistence.storageClass | default .Values.server.persistence.storageClass }}
  {{- if $sc }}
  storageClassName: {{ $sc }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ha.withinRegion.persistence.size | default .Values.server.persistence.size }}
{{- end -}}
