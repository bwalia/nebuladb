# Default values for nebuladb.
#
# Philosophy: single-node defaults that work out of the box (`helm
# install nebula .`), with production knobs clearly labelled. Every
# env-var that `nebula-server` accepts has a corresponding values key
# — see `README.md` in the main repo for the full semantics.

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server:
  replicaCount: 1
  image:
    repository: bwalia/nebula-server
    # Pinned so `helm upgrade` is explicit. Use `helm upgrade --set
    # server.image.tag=X` to roll a new version.
    tag: "latest"
    pullPolicy: IfNotPresent
  imagePullSecrets: []

  # Service account: created by default so RBAC policies can be
  # attached. Disable + point at a pre-existing SA for shared envs.
  serviceAccount:
    create: true
    name: ""
    annotations: {}

  podAnnotations: {}
  podLabels: {}

  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 10001
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

  service:
    type: ClusterIP
    # Three distinct listeners, all on the same Pod:
    restPort: 8080
    grpcPort: 50051
    pgPort: 5432

  resources:
    # Conservative demo defaults. Production should size based on
    # corpus; HNSW is mostly RAM-bound (4 bytes per dim per doc).
    limits:
      cpu: "2"
      memory: "2Gi"
    requests:
      cpu: "200m"
      memory: "256Mi"

  # Two questions, two endpoints:
  #   /healthz/live — "is the process alive?" 200 from the moment the
  #                   boot listener binds, through recovery, and from the
  #                   real router after. Touches no index state.
  #   /healthz      — "can it serve?" 503 {"status":"recovering"} until
  #                   WAL/snapshot recovery completes, then 200.
  #
  # Startup and liveness MUST use /healthz/live. They used /healthz, so
  # any recovery longer than the startup budget was killed and restarted
  # from scratch — forever. The budget was raised 15 → 60 min as prod
  # grew, and on Sep 10 recovery outgrew 60 min: prod restart-looped for
  # ~4h. Liveness on /healthz also killed the pod whenever /healthz was
  # slow (e.g. behind the index lock during a snapshot) rather than dead.
  # Recovery time scales with corpus size, so no fixed budget is safe;
  # only a liveness signal that is independent of recovery is.
  #
  # Readiness stays on /healthz: it keeps a recovering or not-yet-able
  # pod out of the Service, which is cheap and reversible.
  startupProbe:
    httpGet:
      path: /healthz/live
      port: 8080
    periodSeconds: 10
    # Only has to cover process start → boot listener bind (ms). Once
    # live, recovery may take as long as it needs.
    failureThreshold: 30
    timeoutSeconds: 5
  # Restarting is expensive (recovery reloads a multi-GB snapshot), so
  # only kill when the HTTP runtime itself has stopped answering for
  # ~4 minutes — a genuine hang, not a slow request.
  livenessProbe:
    httpGet:
      path: /healthz/live
      port: 8080
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 8
  # Readiness is the fast signal — pull a slow node out of the Service
  # quickly, since that is cheap and reversible.
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 10
    failureThreshold: 4

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Env vars forwarded to the binary. Leave any of these unset to
  # fall back to the binary's own defaults (see main README).
  env:
    # LLM provider (RAG). Defaults to MockLlm when unset.
    # LLM provider for /ai/rag and /rag/answer. Leave BOTH blank and the
    # server falls back to MockLlm, which echoes the prompt back as the
    # answer — prod shipped that echo to users because these were empty.
    # Ollama on the LAN; reachable from every ring's pods (verified).
    NEBULA_LLM_OLLAMA_URL: "http://192.168.1.177:11434"
    # Present on that host alongside llama3:latest. The server's own
    # default is "llama3"; pinned here so a model change is a chart change.
    NEBULA_LLM_MODEL: "llama3.1:8b"

    # Embedder provider. Defaults to MockEmbedder when unset.
    NEBULA_OPENAI_API_KEY: ""
    NEBULA_OPENAI_BASE_URL: ""
    NEBULA_OPENAI_MODEL: ""
    NEBULA_EMBED_DIM: "384"
    NEBULA_EMBED_CACHE_SIZE: "20000"

    # SQL result cache + chunker.
    NEBULA_CHUNK_CHARS: "500"
    NEBULA_CHUNK_OVERLAP: "50"
    NEBULA_SQL_CACHE: "on"
    NEBULA_SQL_CACHE_SIZE: "512"
    NEBULA_SQL_CACHE_TTL_SECS: "30"

    # Rate limiting. Prod defaults are tighter than dev; raise
    # NEBULA_RATE_LIMIT_BURST / _RPS to suit workload.
    NEBULA_RATE_LIMIT: "on"
    NEBULA_RATE_LIMIT_BURST: "120"
    NEBULA_RATE_LIMIT_RPS: "20"

    RUST_LOG: "info"

  # Legacy secret-sourced env vars, kept for backward compat. The
  # preferred path is the ExternalSecret (wslvault) block below.
  # Format: { key: secret-name } — envFrom mounts each named Secret.
  secretEnv:
    # NEBULA_API_KEYS: my-api-keys
    # NEBULA_JWT_SECRET: my-jwt-secret

  # PodDisruptionBudget for multi-replica deployments. Defaults
  # disabled (single-replica — no DB to distribute yet).
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

  # Persistence: when enabled, the chart provisions a PVC mounted at
  # /var/lib/nebuladb and sets NEBULA_DATA_DIR so the binary opens
  # in persistent mode — writes go through the WAL, snapshots are
  # taken on demand via the Admin UI, and restarts replay the WAL.
  # Off by default; the default in-memory mode still runs cleanly.
  persistence:
    enabled: false
    storageClass: ""
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  # Ingress for the REST + showcase surfaces. gRPC and pgwire
  # typically live on a Service of type LoadBalancer in prod; this
  # ingress only exposes HTTP.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: nebuladb.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

# ---------------------------------------------------------------------------
# Showcase (React admin UI)
# ---------------------------------------------------------------------------
showcase:
  enabled: true
  image:
    repository: bwalia/nebula-showcase
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: "100m"
      memory: "64Mi"
    requests:
      cpu: "10m"
      memory: "16Mi"
  # NGINX proxies these to the server service at the URL below.
  # Set automatically to the cluster DNS of the server's Service.
  # Override only for split deployments.
  nebulaServerUrl: ""
  # DNS server nginx uses to resolve variable-based proxy_pass targets
  # at request time. The showcase image defaults to Docker's embedded
  # DNS (127.0.0.11), which does not exist in Kubernetes — so we point
  # it at the cluster DNS. 10.43.0.10 is the default kube-dns ClusterIP
  # on k3s (service CIDR 10.43.0.0/16); override if your cluster differs.
  nginxResolver: "10.43.0.10"

# ---------------------------------------------------------------------------
# Redis (bundled Bitnami subchart)
# ---------------------------------------------------------------------------
redis:
  # `enabled=true` deploys Bitnami Redis. `enabled=false` +
  # `externalRedisUrl` pointed at an existing cluster is the
  # production path.
  enabled: false
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false

# External Redis URL (used when redis.enabled is false). If both
# are empty the embedding cache runs in-proc only.
externalRedisUrl: ""

# ---------------------------------------------------------------------------
# Observability — optional ServiceMonitor for kube-prometheus-stack
# ---------------------------------------------------------------------------
serviceMonitor:
  enabled: false
  interval: 15s
  # Additional labels merged onto the ServiceMonitor so
  # kube-prometheus-stack's `serviceMonitorSelector` picks it up.
  labels: {}

# ---------------------------------------------------------------------------
# App secrets via External Secrets Operator (wslvault) — mirrors beacon
# ---------------------------------------------------------------------------
# When enabled, an ExternalSecret pulls the tier's keys from Vault
# (ClusterSecretStore `vault-backend`, a.k.a. wslvault) into a Secret
# named `<release>-secrets`, which nebula-server consumes via envFrom.
# Populate Vault at:
#     {vaultKeyPrefix}/{environment}/{vaultKeySuffix}
#   e.g. secret/nebuladb/int/config
# with any of these keys (all optional — unset => that feature is off):
#     NEBULA_JWT_SECRET, NEBULA_API_KEYS, NEBULA_OPENAI_API_KEY
externalSecret:
  enabled: false
  refreshInterval: "1m"
  storeName: vault-backend
  storeKind: ClusterSecretStore
  # Standalone nebuladb project path (not nested under diytaxreturn).
  vaultKeyPrefix: secret/nebuladb
  vaultKeySuffix: config

# Deployment tier — selects the Vault path segment (int|test|acc|prod).
# Set per-environment in values-<env>.yaml.
environment: ""

# Fallback plain Secret, used ONLY when externalSecret.enabled=false
# (local/dev without Vault). Map of ENV_VAR: value. Never commit real
# secrets here.
secrets: {}
