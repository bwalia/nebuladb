# Integration environment — namespace `int`, host int-nebuladb.nebuladb.net.
#
# Layered on top of values.yaml by the deploy-k3s workflow:
#   helm upgrade --install nebuladb ./deploy/helm/nebuladb \
#     -f values-int.yaml --set server.image.tag=<sha> \
#     --set showcase.image.tag=<sha> -n int --create-namespace
#
# Images are public Docker Hub (bwalia/*), so no imagePullSecret is
# needed. TLS is issued by cert-manager (`main-issuer`) and the host is
# published through Traefik on k3s1 (`ingressClassName: traefik`). The
# wslproxy POP proxies Host-header traffic to 193.237.176.232:8888.

server:
  image:
    repository: bwalia/nebula-server
    # `tag` is overridden at deploy time with the commit short-SHA.
    tag: "latest"
    pullPolicy: IfNotPresent

  # Embeddings: public Ollama gateway (same as prod). Cutover from
  # mock-384 uses POST /admin/embed/migrate then restart — see
  # docs/runbooks/embed-migrate.md.
  env:
    NEBULA_OPENAI_API_KEY: null
    NEBULA_OPENAI_BASE_URL: "https://ollama.workstation.co.uk/v1"
    NEBULA_OPENAI_MODEL: "nomic-embed-text"
    NEBULA_OPENAI_AUTH: "x-api-key"
    NEBULA_EMBED_DIM: "768"

  # Durable database: WAL + snapshots on a PVC (k3s local-path).
  # Recreate strategy + single replica are already the chart defaults.
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: main-issuer
    hosts:
      - host: int-nebuladb.nebuladb.net
        paths:
          # Examples agents API (more-specific path before showcase /).
          - path: /examples
            pathType: Prefix
            service: nebuladb-examples
            portNumber: 80
          # No `service`/`portName` → defaults to the showcase gateway.
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - int-nebuladb.nebuladb.net
        secretName: nebuladb-int-tls

showcase:
  enabled: true
  image:
    repository: bwalia/nebula-showcase
    tag: "latest"
    pullPolicy: IfNotPresent
  # Basic auth (default on); credentials from WSLVault path
  # nebuladb/int/showcase-auth (SHOWCASE_AUTH_USERNAME / _PASSWORD).
  # Path is not seeded yet (ESO SecretSyncedError) — deploy-k3s does
  # not --wait on the ExternalSecret so the rest of the release can
  # still roll; seed the Vault path when int auth is needed.
  auth:
    vault:
      enabled: true

# Claude agents example suite (MCP → NebulaDB), exposed at /examples.
examples:
  enabled: true

# App secrets from wslvault (ESO) — pulls secret/nebuladb/int/config.
# Disabled until Vault is provisioned: the ESO token needs a policy
# granting read on secret/nebuladb/* AND the path must be seeded with
# NEBULA_JWT_SECRET / NEBULA_API_KEYS / NEBULA_OPENAI_API_KEY. helm
# --wait gates the whole rollout on this CR's readiness, so enabling it
# before Vault is ready times out the deploy. nebula-server consumes the
# secret via an optional envFrom, so it runs fine without it meanwhile.
# Flip to true once the Vault policy + seed exist.
externalSecret:
  enabled: false
environment: int

# Within-region follower + cross-region second leader (us-east-1 /
# us-west-2 labels on one cluster). Primary ingress stays on
# int-nebuladb.nebuladb.net; region-b is ClusterIP-only for lab tests.
ha:
  withinRegion:
    enabled: true
    followers: 1
    # Prefer a different node from the primary when the scheduler can.
    # Empty = any node; anti-affinity is left soft via topology later.
  crossRegion:
    enabled: true
    region: us-east-1
    peerRegion: us-west-2
    deployPeerLeader: true
