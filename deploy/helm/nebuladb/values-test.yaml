# Test environment — namespace `test`, host test-showcase.nebuladb.net.
# See values-int.yaml for the full rationale; only host/namespace/TLS
# secret differ per environment.

server:
  image:
    repository: bwalia/nebula-server
    tag: "latest"
    pullPolicy: IfNotPresent

  # Embeddings: dedicated Ollama on Mac Studio :11437 (chat stays :11434).
  env:
    NEBULA_OPENAI_API_KEY: "ollama"
    NEBULA_OPENAI_BASE_URL: "http://192.168.1.177:11437/v1"
    NEBULA_OPENAI_MODEL: "nomic-embed-text"
    NEBULA_EMBED_DIM: "768"

  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: main-issuer
    hosts:
      - host: test-showcase.nebuladb.net
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - test-showcase.nebuladb.net
        secretName: nebuladb-test-tls

showcase:
  enabled: true
  image:
    repository: bwalia/nebula-showcase
    tag: "latest"
    pullPolicy: IfNotPresent

# App secrets from wslvault (ESO) — pulls secret/nebuladb/test/config
# Disabled until Vault is provisioned (policy granting read on
# secret/nebuladb/* + seeded secret/nebuladb/test/config). helm --wait
# gates the rollout on this CR, so enabling it before Vault is ready
# times out the deploy; nebula-server runs fine via optional envFrom.
# Flip to true once the Vault policy + seed exist.
externalSecret:
  enabled: false
environment: test
