<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NebulaDB — Knowledge Ops</title>
    <meta name="description" content="Live showcase of NebulaDB — SQL, documents, vector search, and RAG over one corpus." />
    <!-- Observatory type system: Space Grotesk (display), IBM Plex Sans
         (body), JetBrains Mono (data/queries). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Apply the saved theme *before* React mounts so the page doesn't
      flash light-then-dark. Tailwind reads the `dark` class on <html>.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("nebula-theme");
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (!stored && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
