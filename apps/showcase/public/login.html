<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — NebulaDB Showcase</title>
    <meta name="description" content="Sign in to the NebulaDB showcase with Google or email and password." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("nebula-theme");
          var prefersDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (!stored && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (_) {}
      })();
    </script>
    <style>
      :root {
        --bg: #f4f2ec;
        --bg-elev: #fffcf7;
        --ink: #14110f;
        --muted: #5c564e;
        --line: #d9d2c5;
        --accent: #0f6b5c;
        --accent-ink: #06332c;
        --danger: #9b2c2c;
        --shadow: 0 24px 60px rgba(20, 17, 15, 0.12);
        --font: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;
      }
      html.dark {
        --bg: #0c0b0a;
        --bg-elev: #161311;
        --ink: #f3eee6;
        --muted: #a89f93;
        --line: #2c2722;
        --accent: #3dbaa3;
        --accent-ink: #d8fff5;
        --danger: #f97171;
        --shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: var(--font);
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(15, 107, 92, 0.18), transparent 55%),
          radial-gradient(900px 500px at 100% 0%, rgba(180, 120, 40, 0.12), transparent 50%),
          linear-gradient(160deg, var(--bg), color-mix(in oklab, var(--bg) 80%, #cfc6b6));
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .shell {
        width: min(420px, 100%);
        animation: rise 0.55s ease both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
      }
      .mark {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--bg-elev);
        display: grid;
        place-items: center;
      }
      .brand h1 {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: -0.03em;
      }
      .brand p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .card {
        background: color-mix(in oklab, var(--bg-elev) 92%, white);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 28px 26px 24px;
        backdrop-filter: blur(8px);
      }
      html.dark .card {
        background: color-mix(in oklab, var(--bg-elev) 94%, black);
      }
      .card h2 {
        margin: 0 0 6px;
        font-size: 1.35rem;
        letter-spacing: -0.03em;
      }
      .lede {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.45;
      }
      .google {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        border: 1px solid var(--line);
        background: var(--bg-elev);
        color: var(--ink);
        border-radius: 12px;
        padding: 12px 14px;
        font: inherit;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        text-decoration: none;
        transition: border-color 0.15s, transform 0.15s;
      }
      .google:hover {
        border-color: color-mix(in oklab, var(--accent) 45%, var(--line));
        transform: translateY(-1px);
      }
      .google svg {
        flex: none;
      }
      .divider {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 12px;
        align-items: center;
        margin: 18px 0;
        color: var(--muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        background: var(--line);
      }
      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        margin: 0 0 6px;
      }
      .field {
        margin-bottom: 14px;
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        border-radius: 10px;
        padding: 11px 12px;
        font: inherit;
        font-size: 0.95rem;
      }
      input:focus {
        outline: 2px solid color-mix(in oklab, var(--accent) 55%, transparent);
        outline-offset: 1px;
        border-color: var(--accent);
      }
      .submit {
        width: 100%;
        margin-top: 6px;
        border: 0;
        border-radius: 12px;
        padding: 12px 14px;
        background: var(--accent);
        color: var(--accent-ink);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .submit:hover {
        filter: brightness(1.05);
      }
      .submit:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .err {
        display: none;
        margin: 0 0 14px;
        padding: 10px 12px;
        border-radius: 10px;
        background: color-mix(in oklab, var(--danger) 12%, transparent);
        color: var(--danger);
        font-size: 0.85rem;
      }
      .err.show {
        display: block;
      }
      .meta {
        margin-top: 16px;
        color: var(--muted);
        font-size: 0.75rem;
        font-family: var(--mono);
        text-align: center;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="brand">
        <div class="mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="2" fill="currentColor" />
            <circle cx="3" cy="4" r="1" fill="#0f6b5c" />
            <circle cx="13" cy="5" r="1" fill="#c47a1a" />
            <circle cx="12" cy="12" r="1" fill="currentColor" opacity="0.45" />
            <path d="M8 8 L3 4 M8 8 L13 5 M8 8 L12 12" stroke="currentColor" stroke-opacity="0.35" stroke-width="0.8" />
          </svg>
        </div>
        <div>
          <h1>NebulaDB</h1>
          <p>Knowledge Ops showcase</p>
        </div>
      </div>

      <section class="card">
        <h2>Sign in</h2>
        <p class="lede">Continue with Google, or use an email and password for this showcase.</p>
        <div id="err" class="err" role="alert"></div>

        <a id="google" class="google hidden" href="#">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.5-.4-3.5z" />
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z" />
            <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.2C29.3 36 26.8 37 24 37c-5.3 0-9.7-3.1-11.3-7.5l-6.5 5C9.5 39.6 16.2 44 24 44z" />
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l.1.1 6.3 5.2C39.2 37.3 44 31.5 44 24c0-1.3-.1-2.5-.4-3.5z" />
          </svg>
          Continue with Google
        </a>

        <div id="divider" class="divider hidden"><span>or</span></div>

        <form id="password-form" class="hidden" autocomplete="on">
          <div class="field">
            <label for="email">Email or username</label>
            <input id="email" name="username" type="text" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <button class="submit" type="submit" id="submit">Sign in</button>
        </form>

        <p class="meta" id="meta">Loading sign-in options…</p>
      </section>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var rd = params.get("rd") || "/";
        if (!rd.startsWith("/") || rd.startsWith("//")) rd = "/";

        var errEl = document.getElementById("err");
        var google = document.getElementById("google");
        var divider = document.getElementById("divider");
        var form = document.getElementById("password-form");
        var meta = document.getElementById("meta");
        var submit = document.getElementById("submit");

        function showErr(msg) {
          errEl.textContent = msg;
          errEl.classList.add("show");
        }

        function googleHref() {
          return "/oauth2/start?rd=" + encodeURIComponent(rd);
        }

        fetch("/login-config.json", { credentials: "same-origin", cache: "no-store" })
          .then(function (r) {
            return r.ok ? r.json() : { google: true, password: false, mode: "google" };
          })
          .catch(function () {
            return { google: true, password: false, mode: "google" };
          })
          .then(function (cfg) {
            var hasGoogle = !!cfg.google;
            var hasPassword = !!cfg.password;
            if (hasGoogle) {
              google.classList.remove("hidden");
              google.setAttribute("href", googleHref());
            }
            if (hasPassword) {
              form.classList.remove("hidden");
            }
            if (hasGoogle && hasPassword) {
              divider.classList.remove("hidden");
            }
            if (!hasGoogle && !hasPassword) {
              showErr("No sign-in methods are configured for this showcase.");
              meta.textContent = "";
              return;
            }
            meta.textContent = hasGoogle
              ? "Google session via oauth2-proxy · password uses the showcase vault user"
              : "Email and password for this showcase environment";
          });

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          errEl.classList.remove("show");
          submit.disabled = true;
          var user = document.getElementById("email").value.trim();
          var pass = document.getElementById("password").value;
          if (!user || !pass) {
            showErr("Enter email/username and password.");
            submit.disabled = false;
            return;
          }

          fetch("/login-config.json", { credentials: "same-origin", cache: "no-store" })
            .then(function (r) {
              return r.ok ? r.json() : { mode: "google" };
            })
            .then(function (cfg) {
              if (cfg.mode === "basic") {
                return basicLogin(user, pass);
              }
              return oauthPasswordLogin(user, pass);
            })
            .then(function () {
              window.location.replace(rd);
            })
            .catch(function (err) {
              showErr(err && err.message ? err.message : "Sign-in failed.");
              submit.disabled = false;
            });
        });

        function oauthPasswordLogin(user, pass) {
          var body = new URLSearchParams();
          body.set("username", user);
          body.set("password", pass);
          body.set("rd", rd);
          return fetch("/oauth2/sign_in", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: body.toString(),
            redirect: "manual",
          }).then(function (res) {
            // oauth2-proxy returns 302 on success; 200 with form on failure.
            if (res.status === 302 || res.status === 303 || res.status === 0) {
              return;
            }
            if (res.ok && (res.url || "").indexOf("/oauth2/") === -1) {
              return;
            }
            throw new Error("Invalid email/username or password.");
          });
        }

        function basicLogin(user, pass) {
          var token = btoa(unescape(encodeURIComponent(user + ":" + pass)));
          // Establish the basic-auth realm, then authenticate so the
          // browser caches credentials for same-origin navigations.
          return fetch("/login/basic-check", { credentials: "same-origin" })
            .catch(function () {
              return { status: 401 };
            })
            .then(function () {
              return fetch("/login/basic-check", {
                credentials: "same-origin",
                headers: { Authorization: "Basic " + token },
              });
            })
            .then(function (res) {
              if (!res.ok) throw new Error("Invalid email/username or password.");
            });
        }
      })();
    </script>
  </body>
</html>
